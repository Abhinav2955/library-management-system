name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend - Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: library_db_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: server

    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: library_db_test
      DB_USER: root
      DB_PASSWORD: root_password
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ci_test_access_secret_do_not_use_in_prod
      JWT_REFRESH_SECRET: ci_test_refresh_secret_do_not_use_in_prod
      CLIENT_ORIGIN: http://localhost:5173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Wait for MySQL to accept connections
        run: |
          for i in $(seq 1 20); do
            mysqladmin ping -h 127.0.0.1 -P 3306 -u root -proot_password && break
            echo "Waiting for MySQL... ($i/20)"
            sleep 3
          done

      - name: Wait for Redis to accept connections
        run: |
          for i in $(seq 1 20); do
            redis-cli -h 127.0.0.1 -p 6379 ping && break
            echo "Waiting for Redis... ($i/20)"
            sleep 2
          done

      - name: Run test suite
        run: npm test

  frontend-build:
    name: Frontend - Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build